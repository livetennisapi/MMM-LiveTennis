name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Product-truth pin: quota figures and canonical URLs must stay current.
      - name: truthcheck
        run: sh scripts/truthcheck.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The unit tests load the real MagicMirror² core (node_helper, logger),
      # exactly as the module runs in production, via MM_ROOT.
      - name: Check out MagicMirror² core
        run: |
          git clone --depth 1 https://github.com/MagicMirrorOrg/MagicMirror /tmp/MagicMirror
          cd /tmp/MagicMirror && npm install --omit=dev --no-audit --no-fund
      - run: npm ci
      # syntax check + eslint + node:test unit suite, against an in-process
      # mock API — no network, no credential.
      - run: npm test
        env:
          MM_ROOT: /tmp/MagicMirror
